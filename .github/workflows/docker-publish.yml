name: Build and Publish Docker Image

# Manual publish is a workflow_dispatch of Tests. workflow_run does not
# receive that run's inputs, so there is no version input here. Images are
# tagged from the branch or tag that Tests ran on, plus the short sha of
# the tested commit.

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/neo4g/operator

jobs:
  build-and-push:
    # pull_request completions are not listed, so they do not publish.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (
        github.event.workflow_run.event == 'workflow_dispatch' ||
        (
          github.event.workflow_run.event == 'push' &&
          (
            github.event.workflow_run.head_branch == 'main' ||
            startsWith(github.event.workflow_run.head_branch, 'v')
          )
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # workflow_run's GITHUB_SHA is the default-branch tip. type=sha and the
      # image revision must use the commit Tests actually ran.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_branch }},priority=600,enable=${{ github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main' }}
            type=semver,pattern={{version}},value=${{ github.event.workflow_run.head_branch }},enable=${{ github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.workflow_run.head_branch }},enable=${{ github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v') }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
