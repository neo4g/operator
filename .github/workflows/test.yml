name: Tests

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - Makefile
      - "api/**"
      - "config/**"
      - Dockerfile
      - ".github/workflows/docker-publish.yml"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - Makefile
      - "api/**"
      - "config/**"
      - Dockerfile
      - ".github/workflows/docker-publish.yml"
      - ".github/workflows/test.yml"
  workflow_dispatch:

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test
